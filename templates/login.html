{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block auth_content %}
<div class="card auth-card">
  <div class="card-header text-center">
    <h1 class="h4 mb-0">Welcome back</h1>
    <p class="text-muted mb-0 mt-1" style="font-size:.82rem">Sign in to your workspace</p>
  </div>
  <div class="card-body">
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input type="email" name="email" id="email" class="form-control" required autofocus autocomplete="email">
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input type="password" name="password" id="password" class="form-control" required autocomplete="current-password">
      </div>
      <button class="btn btn-primary w-100 py-2">Sign in</button>
    </form>
    <p class="text-muted mt-3 mb-0 text-center" style="font-size:.8rem">
      First account? <a href="{{ url_for('register') }}" class="text-accent">Register as admin</a>
    </p>
  </div>
</div>
{% endblock %}
